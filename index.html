<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Selfie Camera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; }
        iframe { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>
    <iframe id="oz-frame" allow="camera; microphone"></iframe>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var sessionId = params.get('ses');

            if (!sessionId) {
                document.body.innerHTML = '<p style="color:#ff4444;text-align:center;padding:20px;">Missing session ID.</p>';
                return;
            }

            var url = 'https://web-sdk.prod.cdn.spain.ozforensics.com/blsinternational/plugin_liveness.php?ses=' + encodeURIComponent(sessionId);
            document.getElementById('oz-frame').src = url;
        })();
    </script>
</body>
</html>
